# Единственная точка конфигурации ДЗ 3.
# Ни один путь, порог или размер среза не должен появляться в коде строкой.

collect:
  # Версия датасета переключается ЗДЕСЬ. Всё остальное — следствие.
  version: "v2"              # v1 | v2

  # Источник — выгрузка Stack Exchange (Cross Validated: сайт вопросов и ответов
  # по статистике и машинному обучению). Три CSV-файла: вопросы, ответы, теги.
  # Пути дублируются в deps стадии collect в dvc.yaml: dvc.yaml не умеет читать
  # params, поэтому согласованность проверяется в tests/check.sh.
  sources:
    v1:
      questions: "dataset/Questions.csv"
      answers: "dataset/Answers.csv"
      tags: "dataset/Tags.csv"
    v2:
      questions: "dataset/Questions.csv"
      answers: "dataset/Answers.csv"
      tags: "dataset/Tags.csv"

  # Объём среза — по версиям. v1 — базовая, v2 — расширенная: больше строк и
  # выше потолок на тему (потолок держит долю крупнейшей группы под
  # diversity.max_group_share). Меняется только это, контракт raw.jsonl тот же.
  n_rows:
    v1: 2200
    v2: 6000
  max_per_topic:
    v1: 60
    v2: 120

  # --- Переработка источника ---
  # Чужой готовый набор — это сырьё, а не сдача (README, «Готовый датасет как
  # источник»). Три блока ниже — то, чем эталон отличается от «скачал CSV и
  # переименовал в raw.jsonl». Каждый обязан быть отражён в docs/datasheet.md.

  # «Сужение»: своя предметная область — 125 тегов статистики и машинного
  # обучения. Вопросы остальных тем в датасет не попадают (счётчик в метриках).
  # null — не сужать (все темы источника).
  topics:
    - "r"
    - "regression"
    - "machine-learning"
    - "time-series"
    - "probability"
    - "hypothesis-testing"
    - "self-study"
    - "distributions"
    - "logistic"
    - "classification"
