# Пайплайн ДЗ 3: collect → clean → diversity → split.
#
# Два правила, из-за нарушения которых пайплайн «не пересчитывается»:
#   deps — всё, от чего зависит результат: входные данные И код стадии;
#   params — секции params.yaml, при изменении которых стадия обязана
#            переисполниться (пути к источникам живут там, а не в deps).
# Пути в outs дублируют paths.* из params.yaml: dvc.yaml не умеет читать
# params, поэтому согласованность проверяется в tests/check.sh.

stages:
  collect:
    cmd: python -m src.collect
    deps:
      # Источник студента: без этих строк dvc не заметит, что данные изменились.
      - dataset/Questions.csv
      - dataset/Answers.csv
      - dataset/Tags.csv
      - src/collect.py
      - src/config.py
    params:
      # Секция collect целиком: там живёт version. Без params смена версии в
      # params.yaml не инвалидировала бы стадию — dvc решил бы, что
      # пересчитывать нечего, и оставил артефакты прошлой версии.
      - collect
    outs:
      - data/raw.jsonl
    metrics:
      - metrics/collect.json:
          cache: false

  clean:
    cmd: python -m src.clean
    deps:
      - data/raw.jsonl
      - src/clean.py
      - src/dedup.py
      - src/pii.py
      - src/schema.py
      - src/stats.py
      - src/textnorm.py
      - src/config.py
    params:
      - clean
      - paths.clean
    outs:
      - data/clean.jsonl
    metrics:
      - metrics/clean.json:
          cache: false

  diversity:
    cmd: python -m src.diversity
    deps:
      - data/clean.jsonl
      - src/diversity.py
      - src/stats.py
      - src/schema.py
      - src/textnorm.py
      - src/config.py
    params:
      - diversity
      - split.group_key
      - paths.clean
    metrics:
      - metrics/diversity.json:
          cache: false

  split:
    cmd: python -m src.split
    deps:
      - data/clean.jsonl
      - src/split.py
      - src/contamination.py
      - src/dedup.py
      - src/schema.py
      - src/textnorm.py
      - src/config.py
    params:
      - split
      - contamination
      - paths.train
      - paths.val
      - paths.test
    outs:
      # val и test тоже выходы стадии: не объявишь их в outs — они не попадут
      # под управление DVC и не будут версионироваться.
      - data/train.jsonl
      - data/val.jsonl
      - data/test.jsonl
    metrics:
      - metrics/split.json:
          cache: false
